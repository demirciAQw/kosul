name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini olustur
        run: |
          if [ ! -d android ]; then
            flutter create --org com.kocum --project-name kocum --platforms android "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" ./android
          fi

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Android ayarlarini yap
        run: dart tool/patch_android.dart

      - name: Kod uret (veritabani)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Testler
        run: flutter test
        continue-on-error: true

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: kocum-apk
          path: build/app/outputs/flutter-apk/app-release.apk
