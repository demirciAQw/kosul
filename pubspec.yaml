name: kocum
description: "Koçum: YKS öğrencileri için tamamen çevrimdışı çalışma, süre ve hata analizi takipçisi."
publish_to: 'none'
version: 6.0.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Durum yönetimi + bağımlılık enjeksiyonu (codegen'siz kullanım)
  flutter_riverpod: ^3.0.0
  # Bildirimsel navigasyon
  go_router: ^16.0.0

  # Yerel veritabanı: SQLite + tip güvenli sorgu + reaktif akışlar + migration araçları
  drift: ^2.28.0
  drift_flutter: ^0.2.4

  # Dosya sistemi
  path_provider: ^2.1.5
  path: ^1.9.0

  # Fotoğraf: çekim/seçim + otomatik sıkıştırma (WebP).
  # Kırpma/döndürme uygulamanın kendi ekranında (lib/core/media/crop_screen.dart).
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # JSON şablon içe aktarma (dosya seç) / dışa aktarma (paylaş: Telegram, WhatsApp, Drive)
  file_picker: ^10.0.0
  # Karne PDF'inden metin ve konum okuma (saf Dart; çevrimdışı)
  syncfusion_flutter_pdf: '>=28.0.0 <40.0.0'
  share_plus: ^11.0.0

  # Bildirimde Android'in yerel kronometresi (arka planda Dart kodu çalıştırmadan)
  flutter_local_notifications: ^19.0.0

  uuid: ^4.5.1
  intl: any # sürümü flutter_localizations sabitler

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/meb/
    - assets/templates/
    - assets/icon/
